name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string
      release_name:
        description: Optional GitHub release title
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release metadata
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
            release_name="$INPUT_RELEASE_NAME"
          else
            release_tag="$REF_NAME"
            release_name="$REF_NAME"
          fi

          if [ -z "$release_name" ]; then
            release_name="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Google Sign-In configuration
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"

      - name: Seed frontend env file
        working-directory: frontend
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          env_path = Path('.env')
          env_path.touch(exist_ok=True)
          entries = {}

          for raw_line in env_path.read_text().splitlines():
              if '=' not in raw_line or raw_line.lstrip().startswith('#'):
                  continue
              key, value = raw_line.split('=', 1)
              entries[key] = value

          entries['EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'] = os.environ['EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID']

          ios_client_id = os.environ.get('EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID', '')
          if ios_client_id:
              entries['EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID'] = ios_client_id

          commit_hash = os.environ.get('GITHUB_SHA', '')
          if commit_hash:
              entries['EXPO_PUBLIC_COMMIT_HASH'] = commit_hash

          ordered_keys = [
              'EXPO_PUBLIC_API_URL',
              'EXPO_PUBLIC_COMMIT_HASH',
              'EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID',
              'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID',
          ]
          remaining_keys = [key for key in entries if key not in ordered_keys]
          lines = [f'{key}={entries[key]}' for key in ordered_keys if key in entries]
          lines += [f'{key}={entries[key]}' for key in remaining_keys]
          env_path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Write google-services.json
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_B64"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json

      - name: Generate Android project
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --non-interactive
          fi

      - name: Apply tracked Android release patches
        working-directory: frontend
        run: npm run prepare:android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and sign release APK
        working-directory: frontend/android
        env:
          EXPO_PUBLIC_COMMIT_HASH: ${{ github.sha }}
          ANDROID_SIGNING_STORE_FILE_B64: ${{ secrets.ANDROID_SIGNING_STORE_FILE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          : "${ANDROID_SIGNING_STORE_FILE_B64:?Missing release keystore}"
          : "${ANDROID_SIGNING_STORE_PASSWORD:?Missing release keystore password}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?Missing release key alias}"
          : "${ANDROID_SIGNING_KEY_PASSWORD:?Missing release key password}"

          export ANDROID_SIGNING_STORE_FILE
          ANDROID_SIGNING_STORE_FILE="$(mktemp "$RUNNER_TEMP/2do-release.XXXXXXXX")"
          trap 'rm -f -- "$ANDROID_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$ANDROID_SIGNING_STORE_FILE_B64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          unset ANDROID_SIGNING_STORE_FILE_B64

          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.release_meta.outputs.release_tag }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          cp frontend/android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/2do-${{ steps.release_meta.outputs.release_tag }}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.release_name }}
          RELEASE_ASSET: ${{ runner.temp }}/2do-${{ steps.release_meta.outputs.release_tag }}.apk
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --title "$RELEASE_NAME" \
              --notes "Automated APK release for $RELEASE_TAG." \
              --target "$GITHUB_SHA"
          fi
