name: Extract Keystore

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          STORE: ${{ secrets.ANDROID_SIGNING_STORE_FILE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$STORE" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"

      - name: Upload signing secrets archive
        env:
          STORE: ${{ secrets.ANDROID_SIGNING_STORE_FILE_B64 }}
          STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          printf '%s' "$STORE" | base64 -d > 2do-release.keystore
          printf '%s' "$STORE_PASS"  > keystore-password.txt
          printf '%s' "$KEY_ALIAS"   > key-alias.txt
          printf '%s' "$KEY_PASS"    > key-password.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-secrets
          path: |
            2do-release.keystore
            keystore-password.txt
            key-alias.txt
            key-password.txt
          retention-days: 1
