<div class="modal-backdrop" id="modal-backdrop" hidden><form class="modal" id="task-form" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">New task</h2><button type="button" class="close" id="close-modal" aria-label="Close task form"><span data-icon="x" data-size="17"></span></button></div><label for="task-title">Task name</label><input id="task-title" maxlength="100" placeholder="Task name" required autocomplete="off"><label for="task-description">Description</label><textarea id="task-description" maxlength="250" placeholder="Add details"></textarea><label for="task-priority">Importance</label><select id="task-priority"><option value="A">Must-Do · Has to happen</option><option value="B" selected>Should-Do · Important</option><option value="C">Can-Do · If there is time</option></select><button class="submit" type="submit">Add task</button><p class="hint">Preview only · Changes reset on reload.</p></form></div>
<script>
const paths={ghost:'<path d="M5 19V9a7 7 0 0 1 14 0v11l-3-2-4 2-4-2-3 2Z"/><path d="M9 9v2m6-2v2m-5 4q2 2 4 0"/>',moon:'<path d="M20.5 13A9 9 0 0 1 11 3.5 9 9 0 1 0 20.5 13Z"/>',sparkles:'<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',leaf:'<path d="M20 4C8 2 2 8 6 15s15 5 14-11Z"/><path d="M4 21 15 10"/>',list:'<path d="m3 6 2 2 3-4m-5 9 2 2 3-4m-5 9 2 2 3-4M12 6h9m-9 7h9m-9 7h9"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h.01m4 0h.01m4 0h.01"/>',checkcircle:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',check:'<path d="m5 12 4 4 10-10"/>',sliders:'<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a7 7 0 0 1 16 0v2"/>',inbox:'<path d="m4 4-2 10v6h20v-6L20 4H4Zm-2 10h6l2 3h4l2-3h6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',grip:'<circle cx="9" cy="6" r=".6"/><circle cx="15" cy="6" r=".6"/><circle cx="9" cy="12" r=".6"/><circle cx="15" cy="12" r=".6"/><circle cx="9" cy="18" r=".6"/><circle cx="15" cy="18" r=".6"/>',x:'<path d="m6 6 12 12M6 18 18 6"/>'};
const icon=(name,size=18)=>'<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||paths.sparkles)+'</svg>';
function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.dataset.size||18))}hydrate();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[{id:1,title:'Send the project proposal',description:'',priority:'A',tag:'Work',due:'Today, 5 pm',steps:'2/3',done:false},{id:2,title:'Pick up a pumpkin',description:'',priority:'A',tag:'Life',due:'Today',done:false},{id:3,title:'Book the dentist appointment',description:'',priority:'B',tag:'Life',steps:'0/2',done:false},{id:4,title:'Plan Friday’s movie night',description:'',priority:'B',tag:'Friends',done:false},{id:5,title:'Evening walk',description:'',priority:'C',tag:'Life',done:false},{id:6,title:'Put the laundry away',description:'',priority:'B',tag:'Life',done:true}];
const friendTasks=[{id:101,title:'Finish the costume',description:'Mia · Just the last few stitches.',priority:'A',tag:'Life',due:'Today',done:false},{id:102,title:'Get snacks for movie night',description:'Alex · Popcorn is a must.',priority:'B',tag:'Friends',done:false},{id:103,title:'Send the reading list',description:'Mia · One less thing on the list.',priority:'B',tag:'Work',done:true}];
let owner='mine',view='active',filter='all',nav='tasks',editing=null,lastFocus=null,toastTimer;
const list=document.getElementById('task-list'),meta={A:['Must-Do','must'],B:['Should-Do','should'],C:['Can-Do','can']};
function card(t){return '<article class="task '+(t.done?'done':'')+'" data-task="'+t.id+'">'+(owner==='mine'?'<button class="check" data-complete="'+t.id+'" aria-label="'+(t.done?'Reopen ':'Complete ')+esc(t.title)+'">'+(t.done?icon('check',14):'')+'</button>':'<span class="avatar" aria-label="'+(t.id===102?'Alex':'Mia')+'">'+(t.id===102?'A':'M')+'</span>')+'<button class="task-content" data-edit="'+t.id+'" aria-label="View '+esc(t.title)+'"><h3>'+esc(t.title)+'</h3><p>'+esc(t.description)+'</p><span class="meta"><span class="tag '+(t.tag==='Life'?'life':'')+'">'+esc(t.tag)+'</span>'+(t.due&&!t.done?'<span class="due">'+icon('clock',10)+esc(t.due)+'</span>':'')+(t.steps?'<span class="steps">'+icon('list',11)+esc(t.steps)+' steps</span>':'')+'</span></button><span class="grip" aria-hidden="true">'+icon('grip',12)+'</span></article>'}
function render(){const source=owner==='mine'?tasks:friendTasks;const all=source.filter(t=>t.done===(view==='done'));const items=all.filter(t=>filter==='all'||t.priority===filter);document.getElementById('task-count').textContent=all.length+' '+(view==='done'?'completed':'active')+' task'+(all.length===1?'':'s');document.querySelectorAll('[data-owner]').forEach(b=>b.setAttribute('aria-selected',b.dataset.owner===owner));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===view));document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===filter));document.getElementById('new-task').hidden=owner!=='mine';let html='';if(view==='calendar')html='<div class="calendar-head"><span>October 2026</span>'+icon('calendar',16)+'</div><div class="week">'+['M|26','T|27','W|28','T|29','F|30','S|31','S|1'].map((d,i)=>'<div class="day '+(i===1?'selected':'')+'"><small>'+d.split('|')[0]+'</small>'+d.split('|')[1]+'</div>').join('')+'</div><div class="group-title must">Today <span class="rule"></span></div>';
if(!items.length)html+='<div class="empty">'+icon('ghost',48)+'<h3>'+(view==='done'?'No completed tasks':'No tasks')+'</h3><p>'+(view==='done'?'':'Try another filter.')+'</p></div>';else if(view==='calendar'||view==='done')html+=items.map(card).join('');else for(const p of ['A','B','C']){const group=items.filter(t=>t.priority===p);if(group.length)html+='<h3 class="group-title '+meta[p][1]+'">'+icon(p==='A'?'sparkles':p==='B'?'moon':'leaf',12)+meta[p][0]+'<span class="count">'+group.length+'</span><span class="rule"></span></h3>'+group.map(card).join('')}list.innerHTML=html;}
function notify(message,undo){clearTimeout(toastTimer);const toast=document.getElementById('toast');toast.innerHTML='<span>'+esc(message)+'</span>'+(undo?'<button id="undo">Undo</button>':'');toast.hidden=false;if(undo)document.getElementById('undo').onclick=()=>{undo();toast.hidden=true};toastTimer=setTimeout(()=>toast.hidden=true,4500)}
function burst(x,y){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✦':'·';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',Math.cos(i*Math.PI/4)*65+'px');s.style.setProperty('--y',Math.sin(i*Math.PI/4)*65-20+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
list.addEventListener('click',e=>{const c=e.target.closest('[data-complete]');if(c){const t=tasks.find(t=>t.id===Number(c.dataset.complete));const previous=t.done;if(!previous){const r=c.getBoundingClientRect();burst(r.left+11,r.top+11)}t.done=!t.done;render();notify(t.done?'Task completed.':'Task reopened.',()=>{t.done=previous;render()});return}const edit=e.target.closest('[data-edit]');if(edit){const t=(owner==='mine'?tasks:friendTasks).find(t=>t.id===Number(edit.dataset.edit));if(owner==='mine')openModal(t);else notify(t.description)}});
document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>{owner=b.dataset.owner;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.getElementById('filter-toggle').onclick=()=>{const f=document.getElementById('filters');f.hidden=!f.hidden;document.getElementById('filter-toggle').setAttribute('aria-expanded',!f.hidden)};
function theme(value){document.getElementById('stage').classList.toggle('original',value==='original');document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===value));const b=document.getElementById('mobile-theme');b.setAttribute('aria-pressed',value==='original');b.setAttribute('aria-label',value==='original'?'Switch to Halloween theme':'Compare with original plum theme')}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>theme(b.dataset.theme));document.getElementById('mobile-theme').onclick=()=>theme(document.getElementById('stage').classList.contains('original')?'halloween':'original');
function navigate(value){nav=value;document.querySelectorAll('[data-nav]').forEach(b=>{if(b.closest('nav')){if(b.dataset.nav===nav)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}});document.getElementById('tasks-screen').hidden=nav!=='tasks';const other=document.getElementById('other-screen');other.hidden=nav==='tasks';if(nav==='social')other.innerHTML='<h2>Social</h2><div class="friend-row"><span class="avatar">M</span><div><strong>Mia</strong><p>Working on her costume</p></div><button class="small-action" data-friend-view>View tasks</button></div><div class="friend-row"><span class="avatar">A</span><div><strong>Alex</strong><p>Getting ready for Friday</p></div><button class="small-action" data-friend-view>View tasks</button></div><div class="focus-card">'+icon('ghost',34)+'<h3>Body double</h3><button id="invite-friend">Invite a friend</button></div>';if(nav==='profile')other.innerHTML='<h2>Profile</h2><div class="profile-card"><span class="avatar">S</span><div><strong>Sasha</strong></div></div><div class="settings-row"><span>Appearance</span><strong>Halloween edition</strong></div><div class="settings-row"><span>Timezone</span><strong>Europe / Berlin</strong></div><div class="focus-card">'+icon('moon',28)+'<h3>Theme</h3><button id="profile-theme">Switch palette</button></div><p style="margin-top:24px;font-size:10px;color:var(--dim)">Theme concept · Sample profile</p>';if(nav==='inbox')other.innerHTML='<h2>Inbox</h2><div class="task"><span class="avatar">M</span><div><h3>Mia invited you to focus together</h3><p>25-minute focus session.</p><div class="meta">Today · 10 minutes ago</div><button class="small-action" style="margin-top:15px" id="inbox-session">Preview invitation</button></div></div><div class="empty">'+icon('inbox',35)+'<p>You’re all caught up.</p></div>';hydrate(other);other.querySelectorAll('[data-friend-view]').forEach(b=>b.onclick=()=>{owner='friends';view='active';filter='all';navigate('tasks');render()});const invite=document.getElementById('invite-friend');if(invite)invite.onclick=()=>notify('Preview only. Your friends haven’t been notified.');const pt=document.getElementById('profile-theme');if(pt)pt.onclick=()=>{theme(document.getElementById('stage').classList.contains('original')?'halloween':'original');notify('Preview palette switched.')};const session=document.getElementById('inbox-session');if(session)session.onclick=()=>notify('Mia’s focus session · 25 minutes · Sample invitation');}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
const backdrop=document.getElementById('modal-backdrop');function openModal(task){editing=task||null;lastFocus=document.activeElement;document.getElementById('modal-title').textContent=task?'Edit task':'New task';document.getElementById('task-title').value=task?.title||'';document.getElementById('task-description').value=task?.description||'';document.getElementById('task-priority').value=task?.priority||'B';document.querySelector('.submit').textContent=task?'Save task':'Add task';backdrop.hidden=false;document.getElementById('task-title').focus()}function closeModal(){backdrop.hidden=true;lastFocus?.focus()}
document.getElementById('new-task').onclick=()=>openModal();document.getElementById('close-modal').onclick=closeModal;backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};document.addEventListener('keydown',e=>{if(backdrop.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...backdrop.querySelectorAll('button,input,textarea,select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
document.getElementById('task-form').onsubmit=e=>{e.preventDefault();const title=document.getElementById('task-title').value.trim();if(!title){document.getElementById('task-title').focus();return}const data={title,description:document.getElementById('task-description').value.trim(),priority:document.getElementById('task-priority').value};if(editing)Object.assign(editing,data);else tasks.push({...data,id:Date.now(),tag:'Life',done:false});const wasEdit=!!editing;owner='mine';view='active';filter='all';closeModal();render();notify(wasEdit?'Task updated.':'Task added.')};render();
</script>
</body>
</html>
